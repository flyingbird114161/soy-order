<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳源和醬油 - 團購下單系統</title>
    <style>
        :root { --main-brown: #8b4513; --bg-cream: #f4f1ea; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-cream); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid var(--main-brown); margin-bottom: 20px; padding-bottom: 10px; }
        .instruction-box { background: #fffde7; border: 1px solid #fbc02d; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9em; line-height: 1.6; }
        .instruction-box strong { color: #d32f2f; }
        .category-section { margin: 25px 0 15px 0; }
        .category-title { background: #5d4037; color: white; padding: 8px 15px; border-radius: 5px; font-size: 1.05em; font-weight: bold; margin-bottom: 8px; }
        .category-desc { font-size: 0.85em; color: #666; line-height: 1.6; padding: 0 5px; margin-bottom: 12px; text-align: justify; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; margin-bottom: 10px; }
        .product-card { border: 2px solid #eee; border-radius: 10px; background: #fff; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; position: relative; }
        .product-card.selected { border-color: var(--main-brown); background-color: #fffaf0; outline: 2px solid var(--main-brown); }
        .product-name { font-weight: bold; color: var(--main-brown); margin: 5px 0; font-size: 0.95em; height: 3.2em; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        .product-price { color: #d32f2f; font-weight: bold; font-size: 1.1em; }
        .check-mark { position: absolute; top: 5px; right: 8px; color: var(--main-brown); display: none; font-size: 1.2em; }
        .product-card.selected .check-mark { display: block; }
        .order-panel { background: #fdf5e6; padding: 15px; border-radius: 10px; border-left: 8px solid var(--main-brown); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 15px; }
        .input-group { display: flex; align-items: center; gap: 5px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn-add { background: var(--main-brown); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; flex-grow: 1; height: 42px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.92em; }
        th, td { border: 1px solid #ddd; padding: 10px 5px; text-align: center; }
        th { background-color: var(--main-brown); color: white; }
        .btn-del { background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .summary-box { margin-top: 25px; text-align: right; background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #eee; }
        .final-total { color: #d32f2f; font-size: 1.8em; font-weight: bold; margin-top: 5px; }
        .btn-submit { background: #2e7d32; color: white; border: none; padding: 18px; border-radius: 8px; font-size: 1.3em; cursor: pointer; display: block; margin: 25px auto; width: 100%; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .history-section { margin-top: 50px; border-top: 3px double var(--main-brown); padding-top: 20px; }
        .note-text { color: #d32f2f; font-size: 0.85em; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>陳源和醬油 團購系統</h1>
        <p style="color: #666;">滿 1,500 元享商品 85 折優惠</p>
    </div>

    <div class="instruction-box">
        <strong>📝 訂單修改操作

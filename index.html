<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳源和醬油 - 團購下單系統</title>
    <style>
        :root { --main-brown: #8b4513; --bg-cream: #f4f1ea; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-cream); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid var(--main-brown); margin-bottom: 15px; padding-bottom: 5px; }
        
        .category-section { margin: 15px 0 10px 0; }
        .category-title { background: #5d4037; color: white; padding: 5px 12px; border-radius: 5px; font-size: 0.95em; font-weight: bold; margin-bottom: 5px; }
        .category-desc { font-size: 0.8em; color: #666; line-height: 1.4; padding: 0 5px; margin-bottom: 8px; text-align: justify; }
        
        /* 縮小勾選卡片 */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 5px; }
        .product-card { border: 1px solid #ddd; border-radius: 8px; background: #fff; padding: 8px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
        .product-card.selected { border-color: var(--main-brown); background-color: #fffaf0; outline: 1.5px solid var(--main-brown); }
        .product-name { font-weight: bold; color: var(--main-brown); margin: 2px 0; font-size: 0.85em; height: 2.4em; display: flex; align-items: center; justify-content: center; line-height: 1.2; }
        .product-price { color: #d32f2f; font-weight: bold; font-size: 0.95em; }
        .check-mark { position: absolute; top: 2px; right: 5px; color: var(--main-brown); display: none; font-size: 1em; }
        .product-card.selected .check-mark { display: block; }
        
        .order-panel { background: #fdf5e6; padding: 12px; border-radius: 10px; border-left: 6px solid var(--main-brown); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0; }
        .input-group { display: flex; align-items: center; gap: 5px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-add { background: var(--main-brown); color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; flex-grow: 1; height: 38px; }
